[alembic]
# %(here)s is the directory holding this file, so the documented commands work
# from the repository root as well as from license_server/.
script_location = %(here)s/alembic
prepend_sys_path = %(here)s/..
# The real URL comes from license_server/.env via alembic/env.py. No deployment
# credential belongs in this committed file.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
qualname =
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
